pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

# Packages whose install scripts are allowed to run (Prisma downloads its engines, esbuild installs its binary).
# Without this, `pnpm install` stops with ERR_PNPM_IGNORED_BUILDS on CI and hosts such as Vercel.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
